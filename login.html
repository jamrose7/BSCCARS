<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - BSCCARS</title>

    <!-- GLOBAL FIRST -->
    <link rel="stylesheet" href="css/global.css">

    <!-- PAGE CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="main-container">

    <!-- LEFT SIDE -->
    <div class="left-section">

        <img src="images/logo.png" alt="Barangay Logo" class="logo">

        <h1>
            Barangay Sillon Community Complaint 
            and Response System
        </h1>

        <p class="tagline">
            “Serving the community with transparency.”
        </p>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right-section">

        <div class="login-card">

            <h2>Welcome Back</h2>
            <p class="subtext">Sign in to continue</p>

            <form>

                <label>Email/Username:</label>
                <input type="text" required>

                <label>Password:</label>
                <div class="password-field">
                    <input type="password" required>
                    <span class="eye">👁️</span>
                </div>

                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn">Login</button>

                <a href="#" class="forgot">Forgot Password?</a>

                <button type="button" class="admin-btn">Admin Login</button>

                <p class="register-text">
                    Don’t have an account? <a href="register.html">Register</a>
                </p>

            </form>

        </div>

    </div>

</div>

</body>
</html>
