<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Public Feed - BSCCARS</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/dashboardWidgets.css" />
    <link rel="stylesheet" href="../css/publicFeed.css" />

    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_io/favicon-32x32.png"
    />
  </head>

  <body>
    <header class="topbar">
      <div class="top-left">
        <img src="../images/logo.png" class="logo" />
        <h1>Barangay Sillon Community Complaint and Response System</h1>
      </div>

      <div class="top-right">
        <button class="icon-badge" aria-label="Notifications">
          <img
            src="../images/notification_icon.png"
            alt="Notifications"
            class="notification-icon"
          />
        </button>
        <button class="icon-badge" aria-label="User profile">
          <img
            src="../images/profile_icon.png"
            alt="Profile"
            class="profile-icon"
          />
        </button>
      </div>
    </header>

       <div class="dashboard-container">
      <aside class="sidebar">
        <nav class="sidebar-menu">
          <a href="residentDashboard.html">
            <img src="../images/dashboard_icon.png" alt="Dashboard" class="sidebar-icon"/>
            Dashboard
          </a>
          <a href="submitComplaint.html">
            <img src="../images/submit_complaint_icon.png" alt="Submit Complaint" class="sidebar-icon"/>
            Submit Complaint
          </a>
          <a href="myComplaints.html" aria-current="page">
            <img src="../images/my_complaints_icon.png" alt="My Complaints" class="sidebar-icon"/>
            My Complaints
          </a>
          <a class="active" href="publicFeed.html">
            <img src="../images/public_feed_icon.png" alt="Public Feed" class="sidebar-icon"/>
            Public Feed
          </a>
        </nav>

        <div class="signout">
          <img src="../images/sign-out_icon.png" alt="Sign out" class="sidebar-icon"/>
          Sign out
        </div>
      </aside>

      <main class="content">
        <h2>Public Feed</h2>

        <div class="filters">
          <div class="search-container">
            <input
              type="text"
              id="searchInput"
              placeholder="Search Complaint"/>
            <span class="search-icon">
              <svg xmlns="http://www.w3.org/2000/svg" 
              width="24" 
              height="24" 
              viewBox="0 0 24 24" 
              fill="none" 
              stroke="currentColor" 
              stroke-width="2" 
              stroke-linecap="round" 
              stroke-linejoin="round" 
              class="lucide lucide-search-icon lucide-search">
              <path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
            </span>
          </div>

          <select name="categoryFilter" id="categoryFilter">
            <option value="" selected>All categories</option>
            <optgroup label="── Auto High Priority Categories ──">
              <option value="Physical Harm, Violence, or Threats">
                Physical Harm, Violence, or Threats
              </option>
              <option value="Public Health Hazard">Public Health Hazard</option>
            </optgroup>
            <optgroup label="── General Categories ──">
              <option value="Noise and Public Disturbance">
                Noise and Public Disturbance
              </option>
              <option value="Waste, Sanitation, and Environment">
                Waste, Sanitation, and Environment
              </option>
              <option value="Road and Infrastructure">
                Road and Infrastructure
              </option>
              <option value="Property Damage">Property Damage</option>
              <option value="Animal Concerns">Animal Concerns</option>
              <option value="Money Debt">Money Debt</option>
              <option value="Illegal or Criminal Activity">
                Illegal or Criminal Activity
              </option>
              <option value="Other">Other</option>
            </optgroup>
          </select>

          <select name="statusFilter" id="statusFilter">
            <option value="" selected>All statuses</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
          <button type="button" id="resetFiltersBtn" class="reset-filters-btn">
            Reset Filters
          </button>        </div>

        <div id="feedContainer"></div>
      </main>
    </div>
    <script src="../js/utils/ui.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/services/notificationManager.js"></script>
    <script src="../js/services/profileManager.js"></script>
    <script src="../js/authGuard.js"></script>
    <script src="../js/publicFeed.js"></script>
  </body>
</html>
