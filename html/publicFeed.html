<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Public Feed - BSCCARS</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/publicFeed.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="top-left">
        <img src="../images/logo.png" class="logo" />
        <h1>Barangay Sillon Community Complaint and Response System</h1>
      </div>

      <div class="top-right">
        <span class="icon">🔔</span>
        <span class="icon">👤</span>
      </div>
    </header>

    <div class="dashboard-container">
      <aside class="sidebar">
        <ul>
          <li>
            <a href="residentDashboard.html">
              <span class="menu-icon">🏠</span> Dashboard</a
            >
          </li>
          <li>
            <a href="submitComplaint.html">
              <span class="menu-icon">📝</span> Submit Complaint</a
            >
          </li>
          <li>
            <a href="myComplaints.html">
              <span class="menu-icon">📋</span> My Complaints</a
            >
          </li>
          <li>
            <a class="active" href="publicFeed.html">
              <span class="menu-icon">🌐</span> Public Feed</a
            >
          </li>
        </ul>

        <div class="logout"><span class="menu-icon">🔒</span> Logout</div>
      </aside>

      <main class="content">
        <h2>Public Feed</h2>

        <div class="filters">
          <div class="search-container">
            <input
              type="text"
              id="searchInput"
              placeholder="Search Complaint"
            />
            <span class="search-icon">🔍</span>
          </div>

          <select id="categoryFilter">
            <option value="">Category</option>
            <option>Public Disturbance</option>
            <option>Parking</option>
            <option>Waste</option>
          </select>

          <select id="statusFilter">
            <option value="">Status</option>
            <option>Pending</option>
            <option>In Progress</option>
            <option>Resolved</option>
          </select>
        </div>

        <div id="feedContainer"></div>
      </main>
    </div>

    <script src="../js/publicFeed.js"></script>
  </body>
</html>
