<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - BSCCARS</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/forgot_password.css" />
  </head>

  <body>
    <div class="main-container">
      <div class="left-section">
        <img src="../images/logo.png" alt="Barangay Logo" class="logo" />
        <h1>Barangay Sillon Community Complaint and Response System</h1>
        <p class="tagline">"Reset your password securely"</p>
      </div>

      <div class="right-section">
        <div class="card">
          <h2>Reset Password</h2>
          <p class="subtext">Enter your account email and a new password.</p>

          <form id="forgotPasswordForm">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" required />

            <label for="newPassword">New Password</label>
            <div class="password-field">
              <input
                type="password"
                name="newPassword"
                id="newPassword"
                required/>
              <span class="eye closed"></span>
            </div>

            <label for="confirmNewPassword">Confirm New Password</label>
            <div class="password-field">
              <input
                type="password"
                name="confirmNewPassword"
                id="confirmNewPassword"
                required/>
              <span class="eye closed"></span>
            </div>

            <button type="submit" class="btn">Reset Password</button>

            <p class="register-text">
              Remember your password? <a href="sign_in.html">Sign in</a>
            </p>
          </form>
        </div>
      </div>
    </div>

    <div id="successModal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Password Reset Successful</h2>
        </div>
        <div class="modal-body">
          <p class="modal-message">
            Your password has been successfully reset.
          </p>
          <p class="modal-message">
            You can now sign in with your new password.
          </p>
          <button
            class="btn btn-back-sign-in"
            onclick="window.location.href = 'sign_in.html'">
            Back to Sign in
          </button>
        </div>
      </div>
    </div>

    <script src="../js/utils/validators.js"></script>
    <script src="../js/utils/ui.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/forgot_password.js"></script>
  </body>
</html>
