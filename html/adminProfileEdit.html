<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Edit Admin Profile - BSCCARS</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/adminDashboard.css" />
    <link rel="stylesheet" href="../css/dashboardWidgets.css" />
    <link rel="stylesheet" href="../css/profile.css" />
  </head>

  <body
    class="profile-page"
    data-profile-page="edit"
    data-profile-return-url="adminProfile.html"
  >
    <header class="topbar">
      <div class="top-left">
        <img
          src="../images/logo.png"
          class="logo"
          alt="Barangay Sillon logo"
        />

        <h1>Barangay Sillon Community Complaint and Response System</h1>
      </div>

      <div class="top-right">
        <button class="icon-badge" aria-label="Notifications">
          <img
            src="../images/notification_icon.png"
            alt="Notifications"
            class="notification-icon"
          />
        </button>

        <button class="icon-badge" aria-label="User profile">
          <img
            src="../images/profile_icon.png"
            alt="Profile"
            class="profile-icon"
          />
        </button>
      </div>
    </header>

    <div class="dashboard-container">
      <aside class="sidebar">
        <nav>
          <a href="adminDashboard.html">
            <img
              src="../images/dashboard_icon.png"
              alt=""
              class="sidebar-icon"
            />
            Dashboard
          </a>

          <a href="adminComplaints.html">
            <img
              src="../images/complaints_icon.png"
              alt=""
              class="sidebar-icon"
            />
            Complaints
          </a>

          <a href="adminResidents.html">
            <img
              src="../images/residents_icon.png"
              alt=""
              class="sidebar-icon"
            />
            Residents
          </a>

          <a href="adminReports.html">
            <img
              src="../images/reports_icon.png"
              alt=""
              class="sidebar-icon"
            />
            Reports
          </a>

          <a href="adminUsers.html">
            <img
              src="../images/user_icon.png"
              alt=""
              class="sidebar-icon"
            />
            Users
          </a>
        </nav>

        <div class="signout" role="button" tabindex="0">
          <img
            src="../images/sign-out_icon.png"
            alt=""
            class="sidebar-icon"
          />
          Sign Out
        </div>
      </aside>

      <main class="main-content">
        <div class="page-heading">
          <div>
            <h2>Edit Profile</h2>
            <p>Update your email address and profile photo.</p>
          </div>
        </div>

        <section class="profile-panel">
          <p
            class="profile-status"
            id="profileStatus"
            aria-live="polite"
          ></p>

          <form id="profileEditForm" class="profile-form">
            <div class="form-row">
              <label for="email">Email Address</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>

            <div 
              class="form-row" 
              id="currentPasswordRow" 
              style="display: none;">
              <label for="currentPassword">Current Password</label>
              <div class="password-field">
                <input
                  id="currentPassword"
                  name="current_password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Required to change your email"
                />
                <span
                  class="eye closed"
                  id="toggleCurrentPassword"
                  role="button"
                  tabindex="0"
                  aria-label="Show password"
                ></span>
              </div>
            </div>

            <div class="form-row">
              <label for="profilePhoto">
                Profile Photo
                <span>(Optional, maximum size: 2 MB)</span>
              </label>

              <input
                id="profilePhoto"
                name="profile_picture_url"
                type="file"
                accept="image/*"
              />
            </div>

            <div class="profile-photo-preview">
              <img
                id="photoPreview"
                src="../images/profile_icon.png"
                alt="Selected profile photo preview"
              />
            </div>

            <div class="profile-form-actions">
              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>

              <a href="adminProfile.html" class="btn btn-secondary">
                Cancel
              </a>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="../js/utils/ui.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/services/notificationManager.js"></script>
    <script src="../js/services/profileManager.js"></script>
    <script src="../js/authGuard.js"></script>
    <script src="../js/profilePage.js"></script>
  </body>
</html>
