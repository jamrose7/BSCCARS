<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign In - BSCCARS</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/sign_in.css" />
  </head>
  <body>
    <div class="main-container">
      <div class="left-section">
        <img src="../images/logo.png" alt="Barangay Logo" class="logo" />

        <h1>Barangay Sillon Community Complaint and Response System</h1>

        <p class="tagline">“Serving the community with transparency.”</p>
      </div>

      <div class="right-section">
        <div class="card">
          <h2>Welcome Back</h2>
          <p class="subtext">Sign in to continue</p>

          <form id="sign_inForm">
            <label>Email:</label>
            <input
              type="email"
              name="email"
              id="email"
              autocomplete="email"
              required/>

            <label>Password:</label>
            <div class="password-field">
              <input
                type="password"
                name="password"
                id="password"
                autocomplete="current-password"
                required/>
              <span
                class="eye closed"
                role="button"
                aria-label="Show password"></span>
            </div>

            <div class="remember">
              <input type="checkbox" name="remember" id="remember" />
              <label for="remember">Remember me</label>
            </div>

            <button type="submit" class="btn">Sign in</button>

            <a href="forgot_password.html" class="forgot">Forgot Password?</a>

            <p class="register-text">
              Don’t have an account? <a href="register.html">Register</a>
            </p>
          </form>
        </div>
      </div>
    </div>
    <script src="../js/utils/validators.js"></script>
    <script src="../js/utils/ui.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/sign_in.js"></script>
  </body>
</html>
