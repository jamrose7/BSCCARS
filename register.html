<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - BSCCARS</title>

    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <div class="main-container">
      <div class="left-section">
        <img src="images/logo.png" alt="Barangay Logo" class="logo" />

        <h1>Barangay Sillon Community Complaint and Response System</h1>

        <p class="tagline">
          Community verification required for account approval
        </p>
      </div>

      <div class="right-section">
        <div class="login-card">
          <h2>Create Account</h2>

          <form>
            <label>Full Name:</label>
            <input type="text" required />

            <label>Date of Birth:</label>
            <input type="date" required />

            <label>Address:</label>
            <input type="text" required />

            <label>Purok/Sitio:</label>
            <input type="text" required />

            <label>Contact Number:</label>
            <input type="text" required />

            <label>Email Address:</label>
            <input type="email" required />

            <label>Password:</label>
            <div class="password-field">
              <input type="password" required />
              <span class="eye">👁️</span>
            </div>

            <label>Confirm Password:</label>
            <div class="password-field">
              <input type="password" required />
              <span class="eye">👁️</span>
            </div>

            <label>Upload Valid ID:</label>
            <input type="file" />

            <div class="terms">
              <input type="checkbox" required />
              <span>
                I confirm I am a resident of Barangay Sillon and information
                provided is true.
              </span>
            </div>

            <button type="submit" class="btn">Register</button>

            <p class="register-text">
              Already have an account? <a href="login.html">Login</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
