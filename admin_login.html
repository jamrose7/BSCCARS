<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial scale=1.0" />
    <title>Admin Login-BSCCARS</title>

    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <div class="main-container">
      <div class="left-section">
        <img src="images/logo.png" class="logo" />

        <h1>Barangay Sillon community Complaint and Response System</h1>

        <p class="tagline">"Serving the community with transparency."</p>
      </div>

      <div class="right-section">
        <div class="login-card">
          <h2>Welcome Admin</h2>
          <p class="subtext">Sign in to continue</p>

          <form id="adminForm">
            <label>Admin Email/Username:</label>
            <input type="text" id="username" required />

            <label>Password:</label>
            <div class="password-field">
              <input type="password" required />
              <span
                class="eye closed"
                role="button"
                aria-label="Show password"
              ></span>
            </div>

            <div class="remember">
              <input type="checkbox" id="remember" />
              <label for="remember">Remember me</label>
            </div>

            <button type="submit" class="btn">Login Admin</button>

            <a href="#" class="forgot">Forgot Password?</a>

            <p class="register-text">
              Don't have an account? <a href="register.html">Register</a>
            </p>
          </form>
        </div>
      </div>
    </div>
    <script src="admin_login.js"></script>
  </body>
</html>
